<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verified</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0d12;
            color: white;

            font-family: Arial, sans-serif;
        }

        .card {
            width: 420px;
            max-width: 90%;

            padding: 45px;

            text-align: center;

            background: #151820;

            border-radius: 22px;

            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .check {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aeb4c0;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="check">✅</div>

    <h1>Verification successful!</h1>

    <p>
        Welcome, {{ username }}!
    </p>

    <p>
        Your Discord account has been verified successfully.
    </p>

</div>

</body>
</html>
