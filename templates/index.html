<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background: #0b0d12;
            color: white;
        }

        .card {
            width: 420px;
            max-width: 90%;
            padding: 40px;

            text-align: center;

            background: #151820;
            border-radius: 22px;

            box-shadow: 0 20px 60px rgba(0,0,0,.5);
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #5865f2;

            font-size: 38px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #aeb4c0;
            line-height: 1.6;
        }

        .verify {
            display: block;

            margin-top: 28px;
            padding: 15px;

            border-radius: 12px;

            background: #5865f2;
            color: white;

            text-decoration: none;
            font-weight: bold;
        }

        .verify:hover {
            background: #4752c4;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">✓</div>

    <h1>Discord Verification</h1>

    <p>
        Verify your Discord account to access the server.
    </p>

    <a class="verify" href="/verify">
        ✅ Continue with Discord
    </a>

</div>

</body>
</html>
