<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💗 Discord Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
            font-family: "Arial Rounded MT Bold", Arial, Helvetica, sans-serif;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;

            background:
                radial-gradient(circle at 20% 20%, #ffb6d9 0%, transparent 28%),
                radial-gradient(circle at 80% 25%, #ffc8e4 0%, transparent 26%),
                radial-gradient(circle at 50% 90%, #ff9dcc 0%, transparent 30%),
                linear-gradient(
                    135deg,
                    #ff78b7,
                    #c95bce 50%,
                    #8b5bd7
                );
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            inset: -5%;

            width: 110%;
            height: 110%;

            background-size: cover;
            background-position: center;

            opacity: 0;

            transform: scale(1.08);

            filter:
                saturate(1.2)
                brightness(.65);

            animation: backgroundSlide 30s infinite;
        }

        .bg1 {
            background-image:
                url("https://cdn.discordapp.com/attachments/1539512033353928759/1542421821473955870/anh-chill-6.jpg?ex=6a912bc3&is=6a8fda43&hm=6aa1114eb3d355cd9ac2bdd6b38950fe2391c5e97d3f2d83cbde106a82c43cca");

            animation-delay: 0s;
        }

        .bg2 {
            background-image:
                url("https://cdn.discordapp.com/attachments/1539512033353928759/1540384826945704006/2e168ec078821b3c5107ffe0dc45f69d_1.jpg?ex=6a91aba9&is=6a905a29&hm=2f398cc089e09ac714b8adc4c087d3662b24da2c95f900a46e9cc7d9b563aa7d");

            animation-delay: 10s;
        }

        .bg3 {
            background-image:
                url("https://cdn.discordapp.com/attachments/1539512033353928759/1539546897310683146/anh-mo-ta.jpg?ex=6a914247&is=6a8ff0c7&hm=59eefc5c68084821a98343cc9c98aea912a63d0a6b11b454b33de591c1e457b1");

            animation-delay: 20s;
        }

        @keyframes backgroundSlide {

            0% {
                opacity: 0;
                transform: scale(1.08);
            }

            8% {
                opacity: .8;
            }

            30% {
                opacity: .8;
                transform: scale(1);
            }

            38% {
                opacity: 0;
                transform: scale(1.05);
            }

            100% {
                opacity: 0;
            }
        }

        .background::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 133, 193, .25),
                    transparent 38%
                ),
                linear-gradient(
                    rgba(82, 29, 73, .30),
                    rgba(48, 18, 54, .78)
                );

            backdrop-filter: blur(5px);
        }

        /* =========================
           HEARTS
        ========================= */

        .hearts {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: -1;

            overflow: hidden;
        }

        .heart {
            position: absolute;

            bottom: -50px;

            font-size: 18px;

            filter:
                drop-shadow(
                    0 0 8px rgba(255,120,190,.8)
                );

            animation:
                heartFloat linear infinite;

            user-select: none;
        }

        @keyframes heartFloat {

            0% {
                transform:
                    translateY(0)
                    translateX(0)
                    rotate(0deg)
                    scale(.8);

                opacity: 0;
            }

            10% {
                opacity: .9;
            }

            50% {
                transform:
                    translateY(-50vh)
                    translateX(35px)
                    rotate(12deg)
                    scale(1);
            }

            100% {
                transform:
                    translateY(-120vh)
                    translateX(-45px)
                    rotate(-15deg)
                    scale(1.2);

                opacity: 0;
            }
        }

        /* =========================
           SPARKLES
        ========================= */

        .sparkles {
            position: fixed;
            inset: 0;

            pointer-events: none;

            z-index: -2;
        }

        .sparkle {
            position: absolute;

            color: rgba(255,255,255,.95);

            font-size: 13px;

            text-shadow:
                0 0 8px #fff,
                0 0 18px #ffb7dc;

            animation:
                sparkleFloat linear infinite;

            user-select: none;
        }

        @keyframes sparkleFloat {

            0% {
                transform:
                    translateY(110vh)
                    rotate(0deg)
                    scale(.7);

                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-15vh)
                    rotate(180deg)
                    scale(1.2);

                opacity: 0;
            }
        }

        /* =========================
           CARD
        ========================= */

        .card-wrapper {
            width: 100%;

            padding: 25px;

            display: flex;
            justify-content: center;

            animation:
                cardAppear 1s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes cardAppear {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(.94);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .card {
            position: relative;

            width: 460px;

            max-width: 100%;

            padding: 45px 38px;

            text-align: center;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.21),
                    rgba(255,255,255,.08)
                );

            border:
                1px solid rgba(255,255,255,.30);

            backdrop-filter:
                blur(28px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(28px)
                saturate(150%);

            box-shadow:
                0 30px 90px rgba(77, 14, 63, .55),
                0 0 50px rgba(255, 117, 188, .20),
                inset 0 1px 0 rgba(255,255,255,.20);

            overflow: hidden;
        }

        .card::before {
            content: "";

            position: absolute;

            width: 290px;
            height: 290px;

            top: -150px;
            left: 50%;

            transform: translateX(-50%);

            background:
                rgba(255, 110, 185, .55);

            filter:
                blur(85px);

            pointer-events: none;
        }

        .card::after {
            content: "💗";

            position: absolute;

            top: 14px;
            right: 18px;

            font-size: 24px;

            animation:
                tinyHeart 2s ease-in-out infinite;
        }

        @keyframes tinyHeart {

            0%,100% {
                transform:
                    scale(1)
                    rotate(0deg);
            }

            50% {
                transform:
                    scale(1.25)
                    rotate(8deg);
            }
        }

        /* =========================
           DECORATION
        ========================= */

        .heart-line {
            position: relative;

            z-index: 2;

            margin-bottom: 10px;

            font-size: 16px;

            letter-spacing: 5px;

            opacity: .9;

            text-shadow:
                0 0 12px rgba(255,150,210,.8);
        }

        /* =========================
           SERVER LOGO
        ========================= */

        .discord-icon {
            position: relative;

            width: 96px;
            height: 96px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            overflow: visible;

            background:
                linear-gradient(
                    145deg,
                    #ffb1d8,
                    #ff72b5 45%,
                    #d65ccf
                );

            border:
                4px solid rgba(255,255,255,.38);

            box-shadow:
                0 0 25px rgba(255,112,183,.8),
                0 0 55px rgba(255,112,183,.45),
                inset 0 4px 15px rgba(255,255,255,.30);

            animation:
                iconFloat 3s ease-in-out infinite;
        }

        /* Logo server */

        .discord-icon img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border-radius: 50%;

            position: relative;

            z-index: 2;

            background: #ff9dcc;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,.2);
        }

        /* Vòng tim */

        .discord-icon::before {

            content: "";

            position: absolute;

            inset: -10px;

            border-radius: 50%;

            border:
                2px dashed rgba(255,180,220,.75);

            animation:
                iconPulse 2.5s ease-out infinite;
        }

        /* Tim nhỏ cạnh logo */

        .discord-icon::after {

            content: "💕";

            position: absolute;

            right: -20px;
            top: -12px;

            font-size: 25px;

            z-index: 4;

            animation:
                floatingMiniHeart 1.8s ease-in-out infinite;
        }

        @keyframes iconFloat {

            0%,100% {
                transform:
                    translateY(0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(2deg);
            }
        }

        @keyframes iconPulse {

            0% {
                transform: scale(.9);
                opacity: .9;
            }

            100% {
                transform: scale(1.35);
                opacity: 0;
            }
        }

        @keyframes floatingMiniHeart {

            0%,100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-7px)
                    scale(1.12);
            }
        }

        /* =========================
           TITLE
        ========================= */

        h1 {

            position: relative;

            z-index: 2;

            font-size: 31px;

            margin-bottom: 12px;

            letter-spacing: -.5px;

            color: #fff7fc;

            text-shadow:
                0 4px 18px rgba(111, 28, 82, .40),
                0 0 20px rgba(255,163,216,.2);
        }

        h1::before {
            content: "💗 ";
        }

        h1::after {
            content: " 💗";
        }

        /* =========================
           TYPING
        ========================= */

        .typing {

            position: relative;

            z-index: 2;

            min-height: 54px;

            color: #ffe6f4;

            line-height: 1.65;

            font-size: 15px;

            margin-bottom: 4px;

            text-shadow:
                0 2px 10px rgba(91,26,75,.25);
        }

        .typing::after {

            content: "♡";

            margin-left: 3px;

            color: #ffb5d9;

            animation:
                cursorBlink .75s infinite;
        }

        @keyframes cursorBlink {

            0%,50% {
                opacity: 1;
            }

            51%,100% {
                opacity: 0;
            }
        }

        /* =========================
           STATUS
        ========================= */

        .status {

            position: relative;

            z-index: 2;

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 17px;
            margin-bottom: 25px;

            padding: 9px 15px;

            border-radius: 999px;

            font-size: 12px;

            color: #fff0f8;

            background:
                rgba(255,255,255,.10);

            border:
                1px solid rgba(255,184,220,.30);

            box-shadow:
                0 0 18px rgba(255,120,185,.15);
        }

        .status::before {
            content: "💗";
        }

        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #8dffcf;

            box-shadow:
                0 0 10px #8dffcf;

            animation:
                statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {

            50% {
                transform: scale(1.4);
                opacity: .5;
            }
        }

        /* =========================
           VERIFY BUTTON
        ========================= */

        .verify {

            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 60px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #ff9acb,
                    #ff69ad 45%,
                    #d86acb
                );

            color: white;

            text-decoration: none;

            font-weight: 700;

            font-size: 16px;

            overflow: hidden;

            border:
                1px solid rgba(255,255,255,.32);

            box-shadow:
                0 12px 30px rgba(255,90,171,.35),
                inset 0 1px 0 rgba(255,255,255,.25);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                filter .25s ease;
        }

        .verify::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 65%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.42),
                    transparent
                );

            transform: skewX(-20deg);

            transition:
                left .65s ease;
        }

        .verify::after {

            content: "💗";

            position: absolute;

            right: 20px;

            font-size: 17px;

            opacity: .9;
        }

        .verify:hover {

            transform:
                translateY(-4px)
                scale(1.02);

            box-shadow:
                0 18px 42px rgba(255,93,174,.55),
                0 0 25px rgba(255,175,219,.25);

            filter:
                brightness(1.08);
        }

        .verify:hover::before {
            left: 130%;
        }

        .verify:active {
            transform: scale(.98);
        }

        .button-icon {
            margin-right: 10px;
            font-size: 20px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {

            position: relative;

            z-index: 2;

            margin-top: 24px;

            color:
                rgba(255,239,248,.62);

            font-size: 11px;
        }

        .footer::before {
            content: "💕 ";
        }

        .footer::after {
            content: " 💕";
        }

        .footer span {

            color: #ffb3d8;

            text-shadow:
                0 0 10px rgba(255,157,205,.3);
        }

        /* =========================
           SIDE HEARTS
        ========================= */

        .side-heart {
            position: absolute;

            font-size: 25px;

            animation:
                sideHeart 2.5s ease-in-out infinite;

            opacity: .9;
        }

        .side-heart.left {
            left: 20px;
            top: 55%;
        }

        .side-heart.right {
            right: 20px;
            top: 32%;

            animation-delay: .8s;
        }

        @keyframes sideHeart {

            0%,100% {
                transform:
                    translateY(0)
                    rotate(-8deg)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(8deg)
                    scale(1.15);
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 500px) {

            .card {
                padding: 36px 23px;
                border-radius: 26px;
            }

            h1 {
                font-size: 25px;
            }

            .discord-icon {
                width: 82px;
                height: 82px;
            }

            .typing {
                font-size: 14px;
            }

            .side-heart {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background">

        <div class="bg-image bg1"></div>
        <div class="bg-image bg2"></div>
        <div class="bg-image bg3"></div>

    </div>


    <!-- HEARTS -->
    <div
        class="hearts"
        id="hearts">
    </div>


    <!-- SPARKLES -->
    <div
        class="sparkles"
        id="sparkles">
    </div>


    <div class="card-wrapper">

        <div class="card">

            <div class="side-heart left">
                💗
            </div>

            <div class="side-heart right">
                💖
            </div>


            <div class="heart-line">
                💕 💗 💞 💓 💕
            </div>


            <!-- =========================
                 SERVER LOGO
                 ========================= -->

            <div class="discord-icon">

                <img
                    src="SERVER_LOGO_URL"
                    alt="Server Logo"
                    onerror="this.src='https://cdn.discordapp.com/attachments/1539512033353928759/1542578300743065700/Gemini_Generated_Image_lx5vdwlx5vdwlx5v.png?ex=6a91bd7e&is=6a906bfe&hm=55996ed34227adab60d4f7a6ea4a09fbfc3944178365c7ee81441cef2578c8db';"
                >

            </div>


            <h1>
                Tven <3 
            </h1>


            <div
                class="typing"
                id="typingText">
            </div>


            <div class="status">

                <span class="status-dot"></span>

                Make by 8zpc (99% skill chatgpt =) )

            </div>


            <!-- VERIFY -->

            <a
                class="verify"
                href="/verify">

                <span class="button-icon">
                    💖
                </span>

                Continue with Discord

            </a>


            <div class="footer">

                Protected by
                <span>Discord OAuth2</span>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           TYPING EFFECT
        ========================= */

        const texts = [

            "💗 Nhớ xác minh để bước vào server nhé bạn <3 ",

            "💕 Chúng tôi cần chắc chắn bạn không phải robot",

            "💖 Xin lỗi vì đã làm phiền bạn <3 ",



        ];


        const typingElement =
            document.getElementById("typingText");


        let textIndex = 0;

        let charIndex = 0;

        let deleting = false;


        function typeText() {

            const currentText =
                texts[textIndex];


            if (!deleting) {

                typingElement.textContent =
                    currentText.substring(
                        0,
                        charIndex + 1
                    );

                charIndex++;


                if (
                    charIndex >=
                    currentText.length
                ) {

                    setTimeout(() => {

                        deleting = true;

                        typeText();

                    }, 1800);

                    return;
                }

            } else {

                typingElement.textContent =
                    currentText.substring(
                        0,
                        charIndex - 1
                    );

                charIndex--;


                if (charIndex <= 0) {

                    deleting = false;

                    textIndex =
                        (
                            textIndex + 1
                        )
                        % texts.length;
                }
            }


            setTimeout(
                typeText,
                deleting
                    ? 25
                    : 45
            );
        }


        typeText();


        /* =========================
           FLOATING HEARTS
        ========================= */

        const hearts =
            document.getElementById("hearts");


        const heartSymbols = [

            "💗",
            "💕",
            "💖",
            "💞",
            "💓",
            "💘",
            "💝",
            "💟",
            "♥",
            "♡"

        ];


        const heartCount = 32;


        for (
            let i = 0;
            i < heartCount;
            i++
        ) {

            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.textContent =
                heartSymbols[
                    Math.floor(
                        Math.random()
                        * heartSymbols.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "%";


            heart.style.fontSize =
                (
                    Math.random() * 18
                    + 12
                )
                + "px";


            heart.style.animationDuration =
                (
                    Math.random() * 9
                    + 8
                )
                + "s";


            heart.style.animationDelay =
                Math.random() * 10
                + "s";


            hearts.appendChild(
                heart
            );
        }


        /* =========================
           SPARKLES
        ========================= */

        const sparkles =
            document.getElementById("sparkles");


        const sparkleSymbols = [

            "✦",
            "✧",
            "⋆",
            "✨",
            "♡"

        ];


        const sparkleCount = 28;


        for (
            let i = 0;
            i < sparkleCount;
            i++
        ) {

            const sparkle =
                document.createElement("div");


            sparkle.className =
                "sparkle";


            sparkle.textContent =
                sparkleSymbols[
                    Math.floor(
                        Math.random()
                        * sparkleSymbols.length
                    )
                ];


            sparkle.style.left =
                Math.random() * 100 + "%";


            sparkle.style.animationDuration =
                (
                    Math.random() * 12
                    + 8
                )
                + "s";


            sparkle.style.animationDelay =
                Math.random() * 10
                + "s";


            sparkles.appendChild(
                sparkle
            );
        }

    </script>

</body>
</html>
